<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Light Simulator</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .traffic-light {
            width: 100px;
            background-color: black;
            padding: 10px;
            margin: 20px auto;
            border-radius: 15px;
        }

        .light {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #555;
            margin: 10px auto;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Traffic Light Simulator</h1>

    <div class="traffic-light">
        <div class="light" id="red"></div>
        <div class="light" id="yellow"></div>
        <div class="light" id="green"></div>
    </div>

    <button onclick="startTraffic()">Start</button>
    <button onclick="stopTraffic()">Stop</button>

    <script>
        let currentLight = 0;
        let timer = null;

        function changeLight() {
            document.getElementById("red").style.backgroundColor = "#555";
            document.getElementById("yellow").style.backgroundColor = "#555";
            document.getElementById("green").style.backgroundColor = "#555";

            if (currentLight === 0) {
                document.getElementById("red").style.backgroundColor = "red";
                console.log("STOP");
            }
            else if (currentLight === 1) {
                document.getElementById("yellow").style.backgroundColor = "yellow";
                console.log("WAIT");
            }
            else {
                document.getElementById("green").style.backgroundColor = "green";
                console.log("GO");
            }

            currentLight = (currentLight + 1) % 3;
        }

        function startTraffic() {
            if (timer !== null) {
                return;
            }

            currentLight = 0;
            changeLight();

            timer = setInterval(changeLight, 2000);
        }

        function stopTraffic() {
            clearInterval(timer);
            timer = null;

            document.getElementById("red").style.backgroundColor = "#555";
            document.getElementById("yellow").style.backgroundColor = "#555";
            document.getElementById("green").style.backgroundColor = "green";

            console.log("Traffic light stopped");
        }
    </script>

</body>

</html>
