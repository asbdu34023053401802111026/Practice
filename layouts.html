<!DOCTYPE html>
<html>

<head>
    <title>layouts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <style>
        .traffic-light {
            width: 150px;
            height: 300px;
            border-radius: 20px;
            background-color: black;
        }

        .light {
            align-items: center;
            width: 70px;
            ;
            height: 70px;
            border-radius: 50%;
            margin: 10px auto;
            background-color: #555;

        }
    </style>
</head>

<body>

    <h1 class="text-center">Traffic light </h1>
    <div class="traffic-light container text-center align-item-center mt-4 p-4">
        <div class="light" id="red"> </div>
        <div class="light" id="yellow"></div>
        <div class="light" id="green"></div>
    </div>
    <div class="container align-item-center  text-center mt-5"> <button class="btn btn-primary"
            onclick="starttraffic()">Start</button>
        <button class="btn btn-primary" onclick="stoptraffic()">Stop</button>
    </div>
    <script>
        let light=0;
        let  timer=null;
        function changeLight(){
            document.getElementById("red").style.backgroundColor="#555";
            document.getElementById("yellow").style.backgroundColor="#555";
            document.getElementById("green").style.backgroundColor="#555";
       
        if(light===0){
            document.getElementById("red").style.backgroundColor="red";


        }else if(light===1){
            document.getElementById("yellow").style.backgroundColor="yellow";

        }else{
            document.getElementById("green").style.backgroundColor="green";
        }
     light=light+1;   
    }
    function starttraffic(){
        if(timer !==null){
            return;

        }
        light=0;
        changeLight()
        timer=setInterval(changeLight,2000);
    }
    function stoptraffic(){
        clearInterval(timer);
        timer=null;
        document.getElementById("red").style.backgroundColor="#555";
        document.getElementById("yellow").style.backgroundColor="#555";
        document.getElementById("green").style.backgroundColor="green";
    }


    </script>
